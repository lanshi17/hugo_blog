# --- 基本站点配置 ---
baseURL: "https://blog.lanshi.site/"
languageCode: "zh-cn"
defaultContentLanguage: "zh-cn"
title: "lanshi个人博客"
theme: "PaperMod"
enableEmoji: true
disableHugoGeneratorInject: true
sectionPagesMenu: "main"
googleAnalytics: "G-B5B8VFF5M8"
busuanzi:
  enable: true
buildDrafts: false

# --- 沉浸式阅读配置 ---
immersiveReading: true
readingProgressBar: true
focusMode: true

# --- 资源压缩 ---
minify:
  disableXML: true
  minifyOutput: true

security:
  funcs:
    getenv:
      - '^HUGO_'
      - '^CI$'
      - '^OPENAI_'
      - '^AI_ASSISTANT_'
      - '^AI_SEARCH_'

# --- 菜单配置 ---
menu:
  main:
    - identifier: "resume"
      name: "简历"
      url: "/resume/"
      weight: 1
    - identifier: "portfolio"
      name: "作品集"
      url: "/portfolio/"
      weight: 2
    - identifier: "studynotes"
      name: "学习笔记"
      url: "/studynotes/"
      weight: 3
    - identifier: "posts"
      name: "文章"
      url: "/posts/"
      weight: 4
    - identifier: "statistics"
      name: "统计"
      url: "/statistics/"
      weight: 5
    - identifier: "archives"
      name: "归档"
      url: "/archives"
      weight: 25
    - identifier: "search"
      name: "搜索"
      url: "/search/"
      weight: 28

# --- 网站参数配置 ---
params:
  author: "烂石"
  description: "记录IT学习资源、教程和个人作品展示。"
  keywords: ["编程", "博客", "IT教程", "学习记录", "PaperMod", "作品集"]
  defaultTheme: "auto"
  disableThemeToggle: false
  logo: "/images/logo.png"
  showReadingTime: true
  showToc: true
  tocOpen: false
  tocSide: true
  headerDepth: 3
  enableGitInfo: true
  canonifyURLs: true
  disableScrollToTop: false
  codeEditable: true
  livePreview: true
  fastSearch: true
  enableTaxonomies: true
  # 沉浸式阅读增强
  immersiveReadingMode: true
  readingProgressBar: true
  readingProgressPosition: "top"
  focusMode: true
  distractionFreeMode: false
  lineHeight: 1.8
  paragraphSpacing: 1.8
  letterSpacing: 0.02
  fontSize: 17
  assets:
    disableFingerprinting: false
    favicon: "/favicon.ico"
    disableHLJS: false
  navbar:
    enable: true
    search: true
    languageMenu: false
    darkModeMenu: true
  socialIcons:
    - name: "bilibili"
      url: "https://space.bilibili.com/176072673?spm_id_from=333.1007.0.0"
    - name: "tiktok"
      url: "https://v.douyin.com/i5BEn6SC/"
    - name: "wechat"
      url: "https://linxichat.oss-cn-shenzhen.aliyuncs.com/website/wechat.png"
    - name: "qq"
      url: "https://qm.qq.com/q/NAXbuT3rQA"
    - name: "github"
      url: "https://github.com/lanshi17"
  ShowShareButtons: true
  ShareButtons: ["wechat", "qq", "bilibili", "github", "tiktok"]
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowWordCount: true
  ShowCodeCopyButtons: true
  hideCopyright: false
  enableWordCountChart: true
  math: "katex"
  comments:
    enabled: true
    provider: "giscus"
    giscusConfig:
      repo: "lanshi17/hugo_blog"
      repoID: "R_kgDOOBU9PQ"
      category: "Announcements"
      categoryID: "DIC_kwDOOBU9Pc4C540H"
      mapping: "pathname"
      strict: false
      reactionsEnabled: true
      emitMetadata: false
      inputPosition: "bottom"
      theme: "dark"
      lang: "zh-CN"
      loading: "lazy"
  share:
    wechat: true
    qq: true
    tiktok: true
    github: true
    bilibili: true
  profileMode:
    enabled: false
    title: "lanshi的个人博客"
    subtitle: "记录IT学习资源、教程和个人作品，分享我的技术之旅"
    imageUrl: "/images/profile.png"
    imageTitle: "lanshi 头像"
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: "作品集"
        url: "/portfolio/"
      - name: "学习笔记"
        url: "/studynotes/"
      - name: "文章"
        url: "/posts/"
      - name: "简历"
        url: "/resume/"
      - name: "Github"
        url: "https://github.com/lanshi17"
  sitemap:
    changefreq: "daily"
    priority: 0.5
  homeInfoParams:
    enabled: true
    Title: "欢迎来到lanshi的个人博客"
    Content: "Welcome to lanshi's blog"
  fusejs:
    highlight: false
  markup:
    highlight:
      noClasses: false
      style: "github-dark-default"
  cover:
    hidden: false
  editPost:
    URL: "https://github.com/lanshi17/hugo_blog/tree/master/content"
    Text: "Suggest Changes"
    appendFilePath: true
  search:
    enabled: true
    engine: "embedding"
    placeholder: "输入问题、主题或关键词..."
    maxResultsPerSection: 10
    liveReload: true
    highlightMatches: true
    showEmptyResult: true
    indexFile: "index.json"
    embedding:
      endpoint: "/api/blog-search-embedding"
      vectorIndexFile: "search-vectors.json"
      model: "baai/bge-m3(free)"
      minQueryLength: 2
      maxResults: 8
      scoreThreshold: 0.18
    rerank:
      enabled: true
      endpoint: "/api/blog-search-rerank"
      model: "BAAI/bge-reranker-v2-m3(free)"
      recallK: 24
      topN: 8
    fuseOpts:
      tokenize: true
      matchAllTokens: true
      minMatchCharLength: 2
      threshold: 0.3
      distance: 100
      ignoreLocation: true
  listStyle:
    cardLayout: true
    hoverEffect: true
    compactTags: true
  aiAssistant:
    enabled: true
    endpoint: "/api/blog-assistant"
    localProxyBaseUrl: "http://127.0.0.1:8787"
    requestFormat: "openai-chat"
    model: "qwen/qwen3.5-27b(free)"
    models:
      - "qwen/qwen3.5-27b(free)"
      - "qwen/qwen3.5-35b-a3b(free)"
    temperature: 0.2
    maxContextChars: 12000
    maxChunks: 6
    title: "AI 文章助手"
    greeting: "可以直接问文章要点、术语或代码细节。"
    placeholder: "问文章内容、术语或结论"
    fallbackHint: "当前未配置 AI 接口，先使用文章检索模式回答。"
    errorHint: "AI 接口暂时不可用，已自动切换到文章检索模式。"
    directRemote:
      enabled: false
      baseURL: ""
      apiPath: "/chat/completions"
      apiKeyEnv: "OPENAI_API_KEY"
      apiKey: ""
      apiKeyHeader: "Authorization"
      apiKeyPrefix: "Bearer "
      exposeApiKeyInBrowser: false
    suggestedQuestions:
      - "一句话总结"
      - "3 个重点"
      - "关键代码/结论"

# --- 输出格式配置 ---
outputFormats:
  JSON:
    mediaType: "application/json"
    baseName: "index"
    isPlainText: true
    notAlternative: true

# --- 输出配置 ---
outputs:
  home: ["HTML", "RSS", "JSON"]

# --- 构建配置 ---
buildFuture: false
buildExpired: false

# --- 环境变量 ---
env: "production"
